<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MtF 资源站</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <style>
    /* ================= 1. 设计系统变量 ================= */
    :root {
      --trans-blue: #5BCEFA;
      --trans-pink: #F5A9B8;
      --trans-white: #FFFFFF;
      --vp-c-brand: #7C6FE8;
      --vp-c-brand-light: #A99EF0;
      --vp-c-trans: linear-gradient(135deg, var(--trans-blue), var(--trans-pink), var(--trans-white));
      --vp-c-bg: #ffffff;
      --vp-c-bg-alt: #f6f6f7;
      --vp-c-bg-soft: #f9f9fa;
      --vp-c-text-1: #2c2c2c;
      --vp-c-text-2: #6b6b80;
      --vp-c-divider: #e2e2e3;
      --vp-c-border: #e8e8ee;
      --vp-font-family: "Inter", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --vp-nav-height: 56px;
      --vp-sidebar-width: 260px;
      --vp-toc-width: 220px;

      /* 缓动曲线（来源：emilkowalski/skills） */
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    }

    .dark {
      --vp-c-bg: #12121a;
      --vp-c-bg-alt: #1e1e2a;
      --vp-c-bg-soft: #1a1a24;
      --vp-c-text-1: #e8e8f0;
      --vp-c-text-2: #9a9ab0;
      --vp-c-divider: #2e2e3e;
      --vp-c-border: #2e2e3e;
    }

    /* ================= 2. 基础重置与排版 ================= */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--vp-font-family);
      background-color: var(--vp-c-bg);
      color: var(--vp-c-text-1);
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      /* 主题切换：只过渡颜色相关属性，避免 all */
      transition:
        background-color 200ms var(--ease-out),
        color 200ms var(--ease-out);
    }
    a { color: var(--vp-c-brand); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* 顶部 Trans 渐变细条 */
    .trans-top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(to right, var(--trans-blue), var(--trans-pink), var(--trans-white), var(--trans-pink), var(--trans-blue));
      z-index: 1000;
    }

    /* 脚注 */
    .footnote-ref a {
      color: var(--vp-c-brand);
      text-decoration: none;
      font-size: 0.75em;
      padding: 0 1px;
    }
    .footnote-ref a:hover { text-decoration: underline; }

    .footnote-divider {
      border: none;
      border-top: 1px solid var(--vp-c-divider);
      margin: 48px 0 16px 0;
    }
    .footnotes {
      font-size: 13px;
      color: var(--vp-c-text-2);
      padding-left: 22px;
      line-height: 1.8;
    }
    .footnotes li { margin-bottom: 6px; }
    .footnote-back {
      color: var(--vp-c-brand);
      text-decoration: none;
      margin-left: 6px;
    }
    .footnote-back:hover { text-decoration: underline; }

    /* ================= 3. 顶部导航栏 ================= */
    header {
      position: fixed;
      top: 3px;
      left: 0; right: 0;
      height: var(--vp-nav-height);
      background-color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--vp-c-divider);
      display: flex;
      align-items: center;
      padding: 0 24px;
      z-index: 100;
      transition:
        background-color 200ms var(--ease-out),
        border-color 200ms var(--ease-out);
    }
    .dark header { background-color: rgba(18, 18, 26, 0.9); }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 22px;
      color: var(--vp-c-text-1);
      cursor: pointer;
      padding: 6px 10px;
      margin-right: 4px;
      border-radius: 6px;
      line-height: 1;
      transition: background-color 160ms var(--ease-out), transform 160ms var(--ease-out);
    }
    .menu-toggle:active { transform: scale(0.97); }

    .nav-logo {
      font-weight: 700;
      font-size: 18px;
      color: var(--vp-c-text-1);
      margin-right: 40px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .nav-logo span {
      background: var(--vp-c-trans);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
    .nav-links { display: flex; gap: 24px; }
    .nav-links a {
      color: var(--vp-c-text-2);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: color 160ms var(--ease-out);
    }
    .nav-links a:hover, .nav-links a.active { color: var(--vp-c-brand); }

    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
    .theme-toggle {
      background: none; border: none; cursor: pointer;
      font-size: 18px; padding: 4px 8px; border-radius: 6px;
      color: var(--vp-c-text-2);
      line-height: 1;
      transition: background-color 160ms var(--ease-out), transform 160ms var(--ease-out);
    }
    .theme-toggle:active { transform: scale(0.97); }

    /* ================= 4. 主布局 ================= */
    .layout {
      display: flex;
      padding-top: calc(var(--vp-nav-height) + 3px);
      max-width: 1440px;
      margin: 0 auto;
    }

    /* -------- 左侧边栏 -------- */
    aside.sidebar {
      width: var(--vp-sidebar-width);
      flex-shrink: 0;
      padding: 32px 24px;
      position: sticky;
      top: calc(var(--vp-nav-height) + 3px);
      height: calc(100vh - var(--vp-nav-height) - 3px);
      overflow-y: auto;
      border-right: 1px solid var(--vp-c-divider);
      background-color: var(--vp-c-bg);
      transition:
        background-color 200ms var(--ease-out),
        border-color 200ms var(--ease-out);
    }

    /* 作者卡片 */
    .author-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px dashed var(--vp-c-divider);
    }
    .avatar-link {
      position: relative;
      display: block;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--vp-c-trans);
      padding: 3px;
      box-sizing: border-box;
      cursor: pointer;
      text-decoration: none;
      transition: transform 300ms var(--ease-out), box-shadow 300ms var(--ease-out);
      margin-bottom: 12px;
    }
    /* 门控 hover：触屏 tap 不会误触发 */
    @media (hover: hover) and (pointer: fine) {
      .avatar-link:hover {
        transform: scale(1.05) translateY(-2px);
        box-shadow: 0 6px 20px rgba(245, 169, 184, 0.4);
      }
    }
    .avatar-img {
      position: absolute;
      top: 3px; left: 3px;
      width: 64px; height: 64px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      display: block;
      margin: 0; padding: 0;
      background-color: var(--trans-white);
    }
    .author-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--vp-c-text-1);
      margin-top: 12px;
    }
    .author-handle {
      font-size: 12px;
      color: var(--vp-c-text-2);
      margin-top: 2px;
    }
    .author-hint {
      font-size: 10px;
      color: var(--vp-c-text-2);
      opacity: 0.6;
      margin-top: 4px;
      font-style: italic;
    }

    /* 侧边栏导航分组 */
    .sidebar-group { margin-bottom: 24px; }
    .sidebar-title {
      font-size: 13px; font-weight: 700; color: var(--vp-c-text-2);
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
    }
    .sidebar a {
      display: block; font-size: 14px; color: var(--vp-c-text-2);
      padding: 4px 0 4px 12px; border-left: 2px solid transparent;
      text-decoration: none;
      transition: color 200ms var(--ease-out), border-color 200ms var(--ease-out);
    }
    .sidebar a:hover, .sidebar a.active {
      color: var(--vp-c-brand);
      border-left-color: var(--vp-c-brand);
    }

    /* -------- 中间内容区 -------- */
    main.content {
      flex: 1; min-width: 0; padding: 40px 48px; max-width: 840px;
    }
    main.content h1 {
      font-size: 32px; font-weight: 700; line-height: 1.3; margin-bottom: 16px;
    }
    main.content h2 {
      font-size: 24px; font-weight: 600; margin-top: 48px; margin-bottom: 16px;
      padding-bottom: 8px; border-bottom: 1px solid var(--vp-c-divider);
    }
    main.content h3 {
      font-size: 18px; font-weight: 600; margin-top: 32px; margin-bottom: 8px;
    }
    main.content p { margin-bottom: 16px; }
    main.content ul { padding-left: 20px; margin-bottom: 16px; }
    main.content li { margin-bottom: 4px; }

    .trans-tag {
      display: inline-block;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(91,206,250,0.15), rgba(245,169,184,0.15));
      color: var(--vp-c-brand);
      border: 1px solid rgba(124, 111, 232, 0.2);
      margin-bottom: 8px;
    }

    .custom-block {
      padding: 16px; border-radius: 8px; margin: 16px 0;
      font-size: 14px; line-height: 1.6;
      /* 提示框入场：从 translateY(4px) + opacity 0 开始，用 ease-out */
      animation: blockFadeIn 300ms var(--ease-out) both;
    }
    .custom-block.tip { background-color: rgba(124, 111, 232, 0.08); border-left: 4px solid var(--vp-c-brand); }
    .custom-block.warning { background-color: rgba(240, 169, 76, 0.08); border-left: 4px solid #F0A94C; }
    .custom-block.danger { background-color: rgba(224, 92, 92, 0.08); border-left: 4px solid #E05C5C; }
    .custom-block-title { font-weight: 700; margin-bottom: 4px; }

    @keyframes blockFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* -------- 右侧目录 -------- */
    aside.toc {
      width: var(--vp-toc-width); flex-shrink: 0; padding: 40px 24px;
      position: sticky; top: calc(var(--vp-nav-height) + 3px);
      height: calc(100vh - var(--vp-nav-height) - 3px); overflow-y: auto;
    }
    .toc-title { font-size: 13px; font-weight: 700; color: var(--vp-c-text-2); margin-bottom: 12px; }
    .toc a {
      display: block; font-size: 13px; color: var(--vp-c-text-2);
      padding: 4px 0; text-decoration: none;
      transition: color 160ms var(--ease-out);
    }
    .toc a:hover { color: var(--vp-c-brand); }
    .toc a.indent { padding-left: 16px; font-size: 12px; }

    /* ================= 5. 遮罩 ================= */
    .sidebar-mask {
      display: none;
      position: fixed;
      top: calc(var(--vp-nav-height) + 3px);
      left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 150;
      opacity: 0;
      transition: opacity 200ms var(--ease-out);
    }
    .sidebar-mask.open {
      display: block;
      opacity: 1;
    }

    /* ================= 6. 响应式 ================= */
    @media (max-width: 1024px) {
      aside.toc { display: none; }
    }

    @media (max-width: 960px) {
      .menu-toggle { display: inline-flex; align-items: center; justify-content: center; }
      .nav-links { display: none; }
      .nav-logo { margin-right: 0; }

      /* 侧边栏抽屉：进入/退出都用同一条 iOS 曲线（可中断） */
      aside.sidebar {
        position: fixed;
        top: calc(var(--vp-nav-height) + 3px);
        left: 0;
        bottom: 0;
        width: 260px;
        height: auto;
        z-index: 200;
        transform: translateX(-100%);
        transition: transform 280ms var(--ease-drawer);
        border-right: 1px solid var(--vp-c-divider);
        box-shadow: 2px 0 12px rgba(0,0,0,0.08);
      }
      aside.sidebar.open { transform: translateX(0); }

      main.content { padding: 24px 20px; }
      header { padding: 0 12px; }
    }

    /* ================= 7. 减少动态偏好 ================= */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      /* 保留透明度过渡以帮助理解状态变化 */
      body, header, aside.sidebar {
        transition: background-color 120ms linear, color 120ms linear, border-color 120ms linear !important;
      }
      .avatar-link:hover { transform: none; }
    }

    .loading {
      color: var(--vp-c-text-2);
      font-size: 14px;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <!-- 顶部 Trans 渐变条 -->
  <div class="trans-top-bar"></div>

  <!-- 移动端侧边栏遮罩 -->
  <div class="sidebar-mask" onclick="toggleSidebar()"></div>

  <!-- 顶部导航 -->
  <header>
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="菜单">☰</button>
    <div class="nav-logo">
      🏳️‍⚧️🍥 <span>MtF</span> 资源站
    </div>
    <nav class="nav-links">
      <a href="#" class="active">首页</a>
      <a href="#">知识库</a>
      <a href="#">经验库</a>
      <a href="#">关于</a>
    </nav>
    <div class="nav-right">
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">🌙</button>
    </div>
    <script src="nav.js"></script>
  </header>

  <!-- 主体三栏布局 -->
  <div class="layout">

    <!-- 左侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="author-card">
        <a href="https://x.com/callyourzephyr" target="_blank" rel="noopener" class="avatar-link" title="点击访问我的 X 主页">
          <img src="https://unavatar.io/x/callyourzephyr" alt="头像" class="avatar-img"
            onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiM3QzZGRTgiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNMjAgMjF2LTJhNCA0IDAgMCAwLTQtNEg4YTQgNCAwIDAgMC00IDR2MiI+PC9wYXRoPjxjaXJjbGUgY3g9IjEyIiBjeT0iNyIgcj0iNCI+PC9jaXJjbGU+PC9zdmc+'">
        </a>
        <div class="author-name">callyourzephyr</div>
        <div class="author-handle">@callyourzephyr</div>
        <div class="author-hint">点击头像访问 X 主页</div>
      </div>

      <div id="sidebar-nav"></div>
    </aside>

    <!-- 中间内容区 -->
    <main class="content" id="content">
      <div class="loading">加载中...</div>
    </main>

    <!-- 右侧目录 -->
    <aside class="toc"></aside>
  </div>

  <script>
    // ================================================================
    // 主题切换
    // ================================================================
    function toggleTheme() {
      const body = document.body;
      body.classList.toggle('dark');
      const btn = document.querySelector('.theme-toggle');
      btn.textContent = body.classList.contains('dark') ? '☀️' : '🌙';
      localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
      notifyIframes();
    }

    function notifyIframes() {
      const isDark = document.body.classList.contains('dark');
      document.querySelectorAll('iframe').forEach(function (iframe) {
        try {
          iframe.contentWindow.postMessage(
            { type: 'theme', theme: isDark ? 'dark' : 'light' },
            '*'
          );
        } catch (e) { /* 跨域时忽略 */ }
      });
    }

    // ================================================================
    // 移动端侧边栏
    // ================================================================
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.querySelector('.sidebar-mask').classList.toggle('open');
    }

    document.addEventListener('click', function (e) {
      const link = e.target.closest('.sidebar a');
      if (link && window.innerWidth <= 960) {
        document.getElementById('sidebar').classList.remove('open');
        document.querySelector('.sidebar-mask').classList.remove('open');
      }
    });

    // 初始化主题
    if (localStorage.getItem('theme') === 'dark' ||
       (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.body.classList.add('dark');
      document.querySelector('.theme-toggle').textContent = '☀️';
    }

    // ================================================================
    // Markdown 加载 + Hash 路由
    // ================================================================
    const contentEl = document.getElementById('content');
    const tocEl = document.querySelector('aside.toc');
    const defaultDoc = 'docs/home.md';

    marked.setOptions({
      breaks: true,
      gfm: true,
      headerIds: true,
      mangle: false
    });

    function getDocPath() {
      const hash = window.location.hash;
      if (hash && hash.startsWith('#/')) {
        return hash.slice(2);
      }
      return defaultDoc;
    }

    // 脚注预处理
    function preprocessFootnotes(md) {
      const defs = {};
      const defRegex = /^\[\^(\w+)\]:[ \t]*(.+)$/gm;
      md = md.replace(defRegex, function (_, id, text) {
        defs[id] = text.trim();
        return '';
      });

      let footnoteIndex = 0;
      const usedIds = {};
      md = md.replace(/\[\^(\w+)\]/g, function (_, id) {
        if (!usedIds[id]) {
          footnoteIndex++;
          usedIds[id] = footnoteIndex;
        }
        const n = usedIds[id];
        return '<sup class="footnote-ref"><a href="#fn-' + id + '" id="fnref-' + id + '">[' + n + ']</a></sup>';
      });

      const usedList = Object.keys(usedIds);
      if (usedList.length > 0) {
        md += '\n\n<hr class="footnote-divider">\n\n<ol class="footnotes">';
        usedList.forEach(function (id) {
          const n = usedIds[id];
          md += '<li id="fn-' + id + '">' +
                '<span class="footnote-text">' + (defs[id] || '') + '</span> ' +
                '<a href="#fnref-' + id + '" class="footnote-back">↩</a>' +
                '</li>';
        });
        md += '</ol>';
      }
      return md;
    }

    function preprocessCallouts(md) {
      return md.replace(
        /:::\s*(tip|warning|danger)\s*([^\n]*)\n([\s\S]*?)\n:::/g,
        function(_, type, title, body) {
          const titleHtml = title.trim()
            ? '<div class="custom-block-title">' + title.trim() + '</div>'
            : '';
          return '<div class="custom-block ' + type + '">' + titleHtml + body + '</div>';
        }
      );
    }

    // ================================================================
    // 侧边栏
    // ================================================================
    function renderSidebar() {
      const container = document.getElementById('sidebar-nav');
      if (!container || !window.SITE_NAV) return;

      let html = '';
      window.SITE_NAV.forEach(function(group) {
        html += '<div class="sidebar-group">';
        html += '<div class="sidebar-title">' + group.title + '</div>';
        group.items.forEach(function(item) {
          const isExternal = item.external || /^https?:\/\//.test(item.link);
          const href = isExternal ? item.link : '#/' + item.link;
          const targetAttr = isExternal ? ' target="_blank" rel="noopener"' : '';
          html += '<a href="' + href + '"' + targetAttr + '>' + item.text + '</a>';
        });
        html += '</div>';
      });
      container.innerHTML = html;
    }

    renderSidebar();

    // ================================================================
    // 加载 Markdown
    // ================================================================
    async function loadDoc(path) {
      contentEl.innerHTML = '<div class="loading">加载中...</div>';
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const md = await res.text();
        const html = marked.parse(preprocessFootnotes(preprocessCallouts(md)));
        contentEl.innerHTML = html;

        const h1 = contentEl.querySelector('h1');
        if (h1) document.title = h1.textContent + ' - MtF 资源站';

        buildToc();
        highlightSidebar(path);

        contentEl.querySelectorAll('iframe').forEach(function (iframe) {
          iframe.addEventListener('load', function () {
            notifyIframes();
          });
        });
        setTimeout(notifyIframes, 300);

        window.scrollTo(0, 0);

      } catch (err) {
        contentEl.innerHTML =
          '<div class="custom-block danger">' +
          '<div class="custom-block-title">加载失败</div>' +
          '无法加载 <code>' + path + '</code>。<br>' +
          '请确认：<br>1. 文件路径正确；<br>2. 你是通过 HTTP 服务器访问（不是直接双击打开 HTML）。' +
          '</div>';
        console.error(err);
      }
    }

    // ================================================================
    // 右侧 TOC
    // ================================================================
    function buildToc() {
      if (!tocEl) return;
      const headings = contentEl.querySelectorAll('h2, h3');
      if (headings.length === 0) {
        tocEl.innerHTML = '';
        return;
      }
      let html = '<div class="toc-title">本页目录</div>';
      headings.forEach(function(h) {
        const cls = h.tagName === 'H3' ? 'indent' : '';
        html += '<a href="#' + h.id + '" class="' + cls + '">' + h.textContent + '</a>';
      });
      tocEl.innerHTML = html;

      // 点击 TOC 时手动滚动；尊重 prefers-reduced-motion
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      tocEl.querySelectorAll('a').forEach(function(a) {
        a.addEventListener('click', function(e) {
          e.preventDefault();
          const id = a.getAttribute('href').slice(1);
          const target = document.getElementById(id);
          if (target) {
            const offset = 80;
            window.scrollTo({
              top: target.offsetTop - offset,
              behavior: prefersReduced ? 'auto' : 'smooth'
            });
          }
        });
      });
    }

    function highlightSidebar(path) {
      document.querySelectorAll('.sidebar a').forEach(function(a) {
        const href = a.getAttribute('href') || '';
        if (href === '#/' + path) {
          a.classList.add('active');
        } else {
          a.classList.remove('active');
        }
      });
    }

    window.addEventListener('hashchange', function() {
      loadDoc(getDocPath());
    });

    loadDoc(getDocPath());

    window.addEventListener('load', function () {
      setTimeout(notifyIframes, 500);
    });
  </script>
</body>
</html>
